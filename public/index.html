<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>AI 带货工作流</title><link rel="stylesheet" href="/style.css"/></head><body>

<main><aside><div class="project-name" id="projectName">未命名项目</div><nav id="nav"><button class="active" data-step="setup"><i>01</i><span>项目设置</span></button><button data-step="product"><i>02</i><span>产品</span></button><button data-step="character"><i>03</i><span>模特</span></button><button data-step="location"><i>04</i><span>场景</span></button><button data-step="plan"><i>05</i><span>视频策划</span></button><button data-step="prompts"><i>06</i><span>Prompt 导出</span></button></nav><div class="side-note"><b>连续性资产</b><div id="assetStates"></div></div></aside>
